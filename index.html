
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d20">
<title>AI Персонажи</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d20;color:white;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#1b1530;border-bottom:1px solid #393052}
h1{margin:0;font-size:25px}
header p,.muted{color:#b9acd8}
main{padding:16px;max-width:650px;margin:auto}
.card{background:#211a38;border:1px solid #41345d;border-radius:18px;padding:18px;margin-bottom:14px}
.avatar{font-size:48px}
button{border:0;border-radius:12px;padding:13px 18px;background:#a78bfa;color:#171027;font-weight:bold;font-size:15px}
#chat{height:300px;overflow-y:auto;padding:12px;background:#151025;border-radius:12px;margin:12px 0}
.message{margin:10px 0;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user{color:#c4b5fd}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #594879;background:#151025;color:white;font-size:16px;margin-bottom:10px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
<h1>✨ AI Персонажи</h1>
<p>Твой мир виртуальных персонажей</p>
</header>
<main>
<div class="card">
<div class="avatar">🤖</div>
<h2>Алекс</h2>
<p class="muted">Дружелюбный виртуальный собеседник</p>
<button id="choose">Общаться с Алексом</button>
</div>
<div class="card">
<h2>💬 Чат с Алексом</h2>
<div id="chat" aria-live="polite">
<div class="message">Алекс: Привет! Я Алекс. Теперь попробуем общаться через настоящий ИИ!</div>
</div>
<form id="form">
<input id="message" placeholder="Напиши сообщение..." maxlength="4000" autocomplete="off">
<button id="send" type="submit">Отправить</button>
</form>
<p class="muted" id="status">Подключение к ИИ готово к проверке.</p>
</div>
</main>
<script>
const API = "https://ai-personazhi-1.onrender.com/api/chat";
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const form = document.getElementById("form");
const send = document.getElementById("send");
const statusText = document.getElementById("status");

function addMessage(name, text, className="message") {
  const div = document.createElement("div");
  div.className = className;
  div.textContent = name + ": " + text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("choose").addEventListener("click", () => {
  input.focus();
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;

  addMessage("Ты", message, "message user");
  input.value = "";
  send.disabled = true;
  statusText.textContent = "Алекс думает…";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message})
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Ошибка сервера");

    addMessage("Алекс", data.reply || "Попробуй написать ещё раз.");
    statusText.textContent = "ИИ подключён";
  } catch (error) {
    addMessage("Система", error.message || "Не удалось связаться с сервером.");
    statusText.textContent = "Не удалось получить ответ";
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
