
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Персонажи</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #100b20;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 700px;
      margin: auto;
    }

    section {
      background: #251b40;
      border: 1px solid #45345e;
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 22px;
    }

    h1, h2 { color: #e1d3ff; }

    p { line-height: 1.6; }

    textarea, input, button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border-radius: 14px;
      font: inherit;
    }

    textarea, input {
      background: #130d22;
      color: white;
      border: 1px solid #a58bff;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: #aa8bff;
      color: #1b1030;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #chat {
      background: #130d22;
      border-radius: 15px;
      padding: 15px;
      min-height: 100px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #result {
      width: 100%;
      margin-top: 18px;
      border-radius: 16px;
    }

    .status {
      color: #d3c5ff;
      overflow-wrap: anywhere;
    }

    .message {
      margin: 12px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    a { color: #d3c5ff; }
  </style>
</head>
<body>
<main>
  <section>
    <h1>🐺 AI Персонажи</h1>
    <p>Общайся с Алексом и создавай собственных фурри-персонажей!</p>
  </section>

  <section>
    <h2>💬 Чат с Алексом</h2>
    <div id="chat" aria-live="polite">
      <div class="message">Алекс: Привет! Я Алекс. Давай общаться!</div>
    </div>

    <form id="chatForm">
      <input id="message" maxlength="4000"
        placeholder="Напиши сообщение..." required>
      <button id="send" type="submit">Отправить</button>
    </form>
    <p id="chatStatus" class="status"></p>
  </section>

  <section>
    <h2>🎨 Генератор фурри</h2>
    <p>Опиши своего персонажа: животное, цвета, одежду, позу и фон.</p>

    <form id="imageForm">
      <textarea id="description" maxlength="800"
        placeholder="Например: серый волк с голубыми глазами, в фиолетовой толстовке, стоит в неоновом городе ночью..."
        required></textarea>
      <button id="generate" type="submit">🐾 Создать фурри</button>
    </form>

    <p id="imageStatus" class="status" aria-live="polite"></p>
    <img id="result" alt="Созданный фурри-персонаж" hidden>
    <p id="downloadArea" hidden>
      <a id="download" download="my-furry.png">Сохранить картинку</a>
    </p>
  </section>
</main>

<script>
  const API = "https://ai-personazhi-1.onrender.com";

  const chat = document.querySelector("#chat");
  const chatForm = document.querySelector("#chatForm");
  const message = document.querySelector("#message");
  const send = document.querySelector("#send");
  const chatStatus = document.querySelector("#chatStatus");

  const imageForm = document.querySelector("#imageForm");
  const description = document.querySelector("#description");
  const generate = document.querySelector("#generate");
  const imageStatus = document.querySelector("#imageStatus");
  const result = document.querySelector("#result");
  const download = document.querySelector("#download");
  const downloadArea = document.querySelector("#downloadArea");

  function addMessage(who, text) {
    const div = document.createElement("div");
    div.className = "message";
    div.textContent = who + ": " + text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  chatForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = message.value.trim();
    if (!text) return;

    addMessage("Ты", text);
    message.value = "";
    send.disabled = true;
    chatStatus.textContent = "Алекс думает...";

    try {
      const response = await fetch(API + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Ошибка чата");

      addMessage("Алекс", data.reply || "Попробуй ещё раз.");
      chatStatus.textContent = "";
    } catch (error) {
      chatStatus.textContent = error.message || "Не удалось получить ответ.";
    } finally {
      send.disabled = false;
    }
  });

  imageForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = description.value.trim();
    if (!text) return;

    generate.disabled = true;
    imageStatus.textContent = "🎨 Создаём персонажа... Это может занять время.";
    result.hidden = true;
    downloadArea.hidden = true;

    try {
      const response = await fetch(API + "/api/image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description: text })
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "Не удалось создать картинку.");
      }

      if (!data.image) throw new Error("Сервер не вернул изображение.");

      const mime = data.mimeType || "image/png";
      const url = "data:" + mime + ";base64," + data.image;

      result.src = url;
      result.hidden = false;
      download.href = url;
      download.download = mime.includes("jpeg") ? "my-furry.jpg" : "my-furry.png";
      downloadArea.hidden = false;
      imageStatus.textContent = "Готово! Твой персонаж создан 🐺";
    } catch (error) {
      imageStatus.textContent = error.message || "Ошибка генерации. Попробуй позже.";
    } finally {
      generate.disabled = false;
    }
  });
</script>
</body>
</html>
